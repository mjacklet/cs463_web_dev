<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <main>
      <section id="form-container" class="col-md-6 my-3 mx-auto">
        <div class="card">
          <div class="card-body">
            <h1 class="card-title text-center mt-6">Roth IRA Calculator</h1>

            <form>
              <div class="form-group row mb-2">
                <label for="balance" class="col-sm-6 col-form-label"
                  >Balance ($)</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="balance" />
                </div>
              </div>
              <div class="form-group row mb-2">
                <label for="annual" class="col-sm-6 col-form-label"
                  >Annual Contribution ($)</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="annual" />
                </div>
              </div>
              <fieldset class="form-group">
                <div class="row mb-2">
                  <legend class="col-form-label col-sm-6 pt-0">
                    Maximize Contributions
                  </legend>
                  <div class="col-sm-6">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="gridRadios"
                        id="gridRadios1"
                        value="option1"
                        checked
                      />
                      <label class="form-check-label" for="gridRadios1">
                        Yes
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="gridRadios"
                        id="gridRadios2"
                        value="option2"
                      />
                      <label class="form-check-label" for="gridRadios2">
                        No
                      </label>
                    </div>
                  </div>
                </div>
              </fieldset>
              <div class="form-group row mb-2">
                <label for="expected" class="col-sm-6 col-form-label"
                  >Expected Rate of Return (%)</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="expected" />
                </div>
              </div>
              <div class="form-group row mb-2">
                <label for="current" class="col-sm-6 col-form-label"
                  >Current Age</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="current" />
                </div>
              </div>
              <div class="form-group row mb-2">
                <label for="retirement" class="col-sm-6 col-form-label"
                  >Retirement Age</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="retirement" />
                </div>
              </div>
              <div class="form-group row mb-2">
                <label for="tax-rate" class="col-sm-6 col-form-label"
                  >Tax Rate (%)</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="tax-rate" />
                </div>
              </div>
              <div class="form-group row mb-2">
                <label for="tax rate" class="col-sm-6 col-form-label"
                  >Marginal Tax Rate (%)</label
                >
                <div class="col-sm-6">
                  <input type="number" class="form-control" id="tax rate" />
                </div>
              </div>

              <div class="form-group row mb-2">
                <div class="col-sm-6 mb-2">
                  <button type="submit" class="btn btn-primary w-100">
                    Calculate
                  </button>
                </div>
                <div class="col-sm-6">
                  <button type="reset" class="btn btn-outline-secondary w-100">
                    Reset
                  </button>
                </div>
              </div>
            </form>

            <p class="card-text text-start text-muted mx-2 mb-2">
              This exercise is a simplified version of a Roth IRA calculator at
              <a href="https://www.calculator.net/roth-ira-calculator.html">
                Calculator.net
              </a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
